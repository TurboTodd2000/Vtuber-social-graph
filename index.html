<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vis Network | Data | Dynamic filtering</title>
  <link rel="stylesheet" href="./style.css">





</head>

<body>
  <h1>Group affliation and relationships of indie vtubers and streamers</h1>

  <h3>NOTE: this is not intended to be an objective map of relationships but only to serve as a "neighborhood map" of folks who know or collab with each other. No malice, ill will or foul intent is ment by this.</h3>

  <p>

    <div>

      <label>
        Filter display
        <select id="nodeFilterSelect">
          <option value="">None</option>
          <option value="1">Groups</option>
          <option value="2">Interests</option>
          <option value="3">Has Collabed With</option>
        </select>
      </label>
      <br />



      <br />
      <br />

      <label>
        Filter edges
        <div>

         <label>
          <input type="radio" name="edgesFilter" id="none" value=""  />
          None
        </label>

        <label>
          <input type="radio" name="edgesFilter" id="group" value="group"  />
          Is/was a <span style="color: green">member</span> of
        </label>

        <label>
          <input type="radio" name="edgesFilter" id="interests" value="interests"  />
          Interests/stream <span style="color: blue">content</span> is
        </label>

        <label>
          <input type="radio" name="edgesFilter" id="collab" value="collab"  />
          Has <span style="color: red">collabed</span> with
        </label>

      </div>

    </label>

  </div>

  <br />
  <div id="mynetwork"></div>
  <script src='https://visjs.github.io/vis-network/standalone/umd/vis-network.min.js'></script><script  src="./script.js"></script>

</body>

</html>
