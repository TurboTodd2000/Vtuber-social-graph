<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Vtuber social network</title>

	<!-- <link rel="stylesheet" href="./style.css"> -->

	<style>




body {
  font-family:
  -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu",
  "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}




#mynetwork {
  width: 99vw;
  height: 85vh;
  border: 1px solid lightgray;
};


		
		.donate-now {
			height: 50px;
		}

		.button {
			float: left;
			margin: 0 5px 0 0;
			width: 250px;
			height: 40px;
			position: relative;
			  border: 1px solid #CCC;
			  text-align: center;
		}

		.button label,
		.button input {
			display: block;
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			padding-top: 5px;
		}

		.button input[type="radio"] {
			opacity: 0.011;
			z-index: 100;
		}

		.button input[type="radio"]:checked + label {
			background: #20b8be;
			border-radius: 4px;
		}

		.button label {
			cursor: pointer;
			z-index: 90;
			line-height: 1.8em;
		}


	</style>
</head>

<body>

	<div>
		<h1>Group affliation and relationships of indie vtubers and streamers</h1>

		<h3>NOTE: this is not intended to be an objective map of relationships but only to serve as a "neighborhood map" of folks who know or collab with each other. No malice, ill will or foul intent is ment by this.</h3>
	</div>

	<div>

		<b>Filter edges</b>

		<div class="donate-now">


			<div class="button">
				<input type="radio" name="edgesFilter" id="group" value="group" checked="checked"  />
				<label for "group" id="group">
					Is/was a member of
				</label>
			</div>



			<div class="button">

				<input type="radio" name="edgesFilter" id="interests" value="interests"  />
				<label for "interests" id="interests">
					Interests/stream content is
				</label>
			</div>


			<div class="button">
				<input type="radio" name="edgesFilter" id="collab" value="collab"  />
				<label for "collab" id="collab">
					Has collabed with
				</label>
			</div>





		</div>



</div>



<div id="mynetwork"></div>

<script src='https://visjs.github.io/vis-network/standalone/umd/vis-network.min.js'></script>
<script  src="./script.js"></script>

</body>

</html>
